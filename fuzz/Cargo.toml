[package]
name = "cdx-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.cdx-core]
path = "../cdx-core"
features = ["signatures", "encryption"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "archive_reader"
path = "fuzz_targets/archive_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parser"
path = "fuzz_targets/manifest_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_parser"
path = "fuzz_targets/block_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mark_parser"
path = "fuzz_targets/mark_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_parser"
path = "fuzz_targets/content_parser.rs"
test = false
doc = false
bench = false
