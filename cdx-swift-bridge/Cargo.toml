[package]
name = "cdx-swift-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "UniFFI bindings for cdx-core, exposing the Codex document format to Swift"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "cdx_swift_bridge"

[features]
default = ["signatures"]
signatures = ["cdx-core/signatures"]
encryption = ["cdx-core/encryption"]

[dependencies]
cdx-core = { path = "../cdx-core" }
uniffi = { version = "0.28", features = ["cli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "now"], default-features = false }
thiserror = "2.0"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
