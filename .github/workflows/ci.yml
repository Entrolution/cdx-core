name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: [self-hosted, macos]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

  lint:
    name: Lint
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.85)
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-features

  wasm:
    name: WASM Build
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build cdx-core for WASM
        run: cargo build -p cdx-core --target wasm32-unknown-unknown --features wasm --no-default-features

  cli-tests:
    name: CLI Integration Tests
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p cdx-cli --release

      - name: Run CLI tests
        run: cargo test -p cdx-cli

  coverage:
    name: Coverage
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --workspace --all-features --out xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  benchmark:
    name: Benchmark
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Restore baseline
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: benchmark-baseline-${{ github.base_ref || 'main' }}
          restore-keys: benchmark-baseline-main

      - name: Run benchmarks
        run: cargo bench --workspace -- --save-baseline pr

      - name: Compare benchmarks
        run: |
          if [ -d "target/criterion" ] && [ -f "target/criterion/main/estimates.json" ]; then
            echo "Comparing against baseline..."
            cargo bench --workspace -- --baseline main --noplot 2>&1 | tee benchmark_results.txt || true
          else
            echo "No baseline found, skipping comparison"
          fi
        continue-on-error: true

      - name: Save baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: benchmark-baseline-main
